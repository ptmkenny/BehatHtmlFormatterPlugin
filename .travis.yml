language: php

dist: jammy

cache:
  directories:
    - $HOME/.composer/cache

php:
  - 8.2
  - 8.3
  - 8.4
  - 8.5

env:
  - DEPS='low'
  - DEPS='normal'

before_install:
  - phpenv config-rm xdebug.ini || true

install:
  - if [ "$DEPS" == "low" ]; then travis_retry composer update --prefer-dist --prefer-lowest --no-interaction; fi
  - if [ "$DEPS" == "normal" ]; then travis_retry composer update --prefer-dist --prefer-stable --no-interaction; fi

script:
  - ./vendor/bin/behat --no-colors
